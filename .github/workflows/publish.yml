name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only validate the token and the build (skip npm publish)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Verify npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack (dry run)
        run: npm pack --dry-run
      # NOTE: the dry_run check lives in the shell on purpose. A step-level
      # `if: !inputs.dry_run` is false on tag pushes because `inputs` is then
      # an object with string defaults, so the publish step silently skips.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo 'dry_run=true: skipping npm publish'
            exit 0
          fi
          npm publish --access public
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION=$(printf '%s' "$TAG" | sed 's/^v//')
          awk -v v="$VERSION" '/^## /{ if (index($0, "## " v) == 1) { p = 1; next } if (p) { exit } } p' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then printf 'Release %s\n' "$TAG" > /tmp/notes.md; fi
          cat /tmp/notes.md
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          gh release create "$TAG" --title "dsh-weekly-report $VERSION" --notes-file /tmp/notes.md
