name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only validate the token and the build (skip npm publish)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Verify npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack (dry run)
        run: npm pack --dry-run
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION=$(printf '%s' "$TAG" | sed 's/^v//')
          awk -v v="$VERSION" '/^## /{ if (index($0, "## " v) == 1) { p = 1; next } if (p) { exit } } p' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then printf 'Release %s\n' "$TAG" > /tmp/notes.md; fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md || gh release edit "$TAG" --title "$TAG" --notes-file /tmp/notes.md
